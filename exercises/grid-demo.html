<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid In-Class Demo</title>
    <style>
        body {
            background-color:hotpink;
            font-family: sans-serif;
            text-transform: uppercase;
        }
        #grid-ex-one div {
            padding: 2vw;
            background-color:honeydew;
        }
        #grid-ex-one {
            margin-left:5vw;
            margin-right:5vw;
            display: grid;
            /* grid-template-columns: 30% 70%; */
            grid-template-columns: repeat(3, 100px);
            /* grid-template-columns: 300px auto 400px; */   
            gap:2px;
        }

        #grid-ex-two {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap:3px;
        }

        #grid-ex-two div {
            background-color:lavender;
            padding:20px;
            color:brown;
        }

        #header {
            grid-row-start:1;
            grid-row-end:2;
            grid-column: 1/6;
        }

        #sidebar {
            grid-row:2/6;
            grid-column: 1/2;
        }

        #footer {
            grid-row:6/7;
            grid-column:1/6;
        }

        #content-one {
            grid-row: 2/4;
            grid-column:2/6;
        }

        #content-two {
            grid-row: 4/6;
            grid-column: 2/4;
        }

        #content-three {
            grid-row: 4/6;
            grid-column:4/6;
        }

        
    </style>
</head>
<body>
    <div id="grid-ex-one">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>


       
    </div>
    <br>
    <div id="grid-ex-two">
        <div id="header">header</div>
        <div id="sidebar">sidebar</div>
        <div id="content-one">content 1</div>
        <div id="content-two">content 2</div>
        <div id="content-three">content 3</div>
        <div id="footer">footer</div>
    </div>
</body>
</html>
