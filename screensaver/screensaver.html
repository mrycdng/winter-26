<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Player Screensaver</title>
    <link rel="stylesheet" href="screensaver.css">
</head>

<body>
    <div id="container">
        <br>
        <!-- <div id="player"></div> -->
        <img id="arm" src="record-player-arm.png"></img>
        <img id="player" src="record-player-base.png"></img>
        <br>
        <p id="p1">♫ NOW PLAYING ♫<br>
            <i>Polonaise in A Flat Major, Op.53</i><br>Frédéric Chopin
        </p>
        <p id="p2">♫ NOW PLAYING ♫<br>
            <i>12 Songs, Op.21: V. Lilacs</i><br>Sergei Rachmaninoff
        </p>
        <p id="p3">♫ NOW PLAYING ♫<br>
            <i>The Seasons, Op. 37a: X. October.</i><br>Sergei Rachmaninoff
        </p>
        <p id="p4">♫ NOW PLAYING ♫<br>
            <i>Fantasia on Greensleeves (Piano Arr.)</i><br>Ralph Vaughan Williams
        </p>
        <img class="record" id="record"></img>
        <audio autoplay loop id="a1">
            <source src="chopin.mp3" type="audio/mpeg">
        </audio>
    </div>
</body>

</html>
